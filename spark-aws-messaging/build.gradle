plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'jacoco'
    id "org.sonarqube" version "4.4.1.3373"
    id 'org.jreleaser' version '1.22.0'
}

group = 'com.fabiogouw'
version = '1.2.0'

base {
    archivesName = 'spark-aws-messaging'
}

repositories {
    mavenCentral()
}

compileJava {
    options.release = 8 // Spark targets Java 8
}

sonar {
    properties {
        property "sonar.projectKey", "fabiogouw_spark-aws-messaging"
        property "sonar.organization", "fabiogouw"
        property "sonar.host.url", "https://sonarcloud.io"
    }
}

dependencies {
    implementation group: 'org.apache.spark', name: 'spark-core_2.12', version: '3.5.9'
    compileOnly group: 'org.apache.spark', name: 'spark-sql_2.12', version: '3.5.9'

    // Use AWS SDK for Java v2 (BOM + SQS module)
    // NOTE: adjust the BOM version to the desired/latest 2.x release if needed
    implementation platform('software.amazon.awssdk:bom:2.49.2')
    implementation 'software.amazon.awssdk:sqs'
    implementation "software.amazon.awssdk:url-connection-client"

    testImplementation 'org.apache.commons:commons-lang3:3.17.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.2'
    testImplementation 'org.testcontainers:testcontainers:1.21.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.ministack:testcontainers-ministack:0.1.5'
    testImplementation group: 'org.apache.spark', name: 'spark-catalyst_2.12', version: '3.5.9'
    testImplementation group: 'org.assertj', name: 'assertj-core', version: '3.27.7'
    testImplementation group: 'org.mockito', name: 'mockito-inline', version: '5.2.0'
}

java {
    withJavadocJar()
    withSourcesJar()
}

tasks.register('copyToLib', Copy) {
    into layout.buildDirectory.dir('libs/deps')
    from configurations.runtimeClasspath
}

jacocoTestReport {
    reports {
        xml.required = true
    }
    dependsOn(test)
}

test {
    useJUnitPlatform()
    dependsOn(copyToLib)
    finalizedBy(jacocoTestReport)
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
            pom {
                name = 'Spark AWS Messaging providers'
                description = 'A custom sink provider for Apache Spark that sends the content of a dataframe to an AWS SQS'
                url = 'https://github.com/fabiogouw/spark-aws-messaging'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'fabiogouw'
                        name = 'Fabio Gouw'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/fabiogouw/spark-aws-messaging.git'
                    developerConnection = 'scm:git:git@github.com:fabiogouw/spark-aws-messaging.git'
                    url = 'https://github.com/fabiogouw/spark-aws-messaging'
                }
            }
        }
    }

    repositories {
        maven {
            name = 'staging'
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}

tasks.named('jreleaserDeploy') {
    dependsOn 'publishAllPublicationsToStagingRepository'
}

tasks.register('publishToMavenCentral') {
    group = 'publishing'
    description = 'Stages the Maven publication and deploys it to Maven Central with JReleaser.'
    dependsOn 'jreleaserDeploy'
}

jreleaser {
    gitRootSearch = true
    release {
        github {
            enabled = true
            repoOwner = 'fabiogouw'
            name = 'spark-aws-messaging'
            skipTag = true
            skipRelease = true
            token = System.getenv('GITHUB_TOKEN')
        }
    }
    signing {
        pgp {
            active = 'ALWAYS'
            armored = true
        }
    }
    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'ALWAYS'
                    namespace = 'com.fabiogouw'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepository('build/staging-deploy')
                    username = System.getenv('MAVEN_CENTRAL_USERNAME')
                    password = System.getenv('MAVEN_CENTRAL_PASSWORD')
                }
            }
        }
    }
}

javadoc {
    if(JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}